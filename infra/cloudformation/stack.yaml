# DEMO: intentionally insecure CloudFormation, so the demo covers a third IaC
# parser alongside Terraform and Kubernetes. Do not deploy.
AWSTemplateFormatVersion: '2010-09-09'
Description: Snyk demo todo app - insecure by design

Resources:
  # DEMO VULN (Snyk IaC): public, unencrypted bucket with no versioning.
  AttachmentsBucket:
    Type: AWS::S3::Bucket
    Properties:
      BucketName: snyk-demo-todo-attachments-cfn
      AccessControl: PublicReadWrite

  # DEMO VULN (Snyk IaC): SQS queue without server-side encryption.
  TodoQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: snyk-demo-todo-events

  # DEMO VULN (Snyk IaC): security group open to the world on SSH and Postgres.
  ApiSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Todo API access
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 22
          ToPort: 22
          CidrIp: 0.0.0.0/0
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          CidrIp: 0.0.0.0/0

  # DEMO VULN (Snyk IaC): IAM role granting full administrative access.
  ApiRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: ec2.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: admin
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: '*'
                Resource: '*'
