# DEMO: intentionally insecure Kubernetes manifests for `snyk iac test infra/k8s`.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-api
  namespace: default
  labels:
    app: todo-api
spec:
  replicas: 1
  selector:
    matchLabels:
      app: todo-api
  template:
    metadata:
      labels:
        app: todo-api
    spec:
      # DEMO VULN (Snyk IaC): shares the host network, PID and IPC namespaces.
      hostNetwork: true
      hostPID: true
      hostIPC: true
      # DEMO VULN (Snyk IaC): default service account token is auto-mounted.
      automountServiceAccountToken: true
      containers:
        - name: api
          # DEMO VULN (Snyk IaC/Container): mutable `latest` tag, no digest pin.
          image: snyk-demo/todo-api:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              hostPort: 3001
          # DEMO VULN (Snyk IaC): no CPU/memory requests or limits set.
          securityContext:
            # DEMO VULN (Snyk IaC): privileged, root, writable FS, all caps.
            privileged: true
            runAsNonRoot: false
            runAsUser: 0
            allowPrivilegeEscalation: true
            readOnlyRootFilesystem: false
            capabilities:
              add:
                - SYS_ADMIN
                - NET_ADMIN
          env:
            # DEMO VULN (Snyk IaC): secrets as plaintext env values in the manifest.
            - name: DATABASE_URL
              value: postgres://todo_admin:S3cretP4ssw0rd@db:5432/todos
            - name: JWT_SECRET
              value: demo-super-secret-do-not-ship-2024
          volumeMounts:
            # DEMO VULN (Snyk IaC): mounts the host filesystem root into the pod.
            - name: host-root
              mountPath: /host
          # DEMO VULN (Snyk IaC): no liveness or readiness probe.
      volumes:
        - name: host-root
          hostPath:
            path: /
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: todo-api
spec:
  # DEMO VULN (Snyk IaC): exposes the API directly to the internet.
  type: LoadBalancer
  selector:
    app: todo-api
  ports:
    - port: 80
      targetPort: 3001
