apiVersion: apps/v1
kind: Deployment
metadata:
  name: todo-api
  namespace: default
  labels:
    app: todo-api
spec:
  replicas: 2
  selector:
    matchLabels:
      app: todo-api
  template:
    metadata:
      labels:
        app: todo-api
    spec:
      # No host namespaces are shared with the pod.
      hostNetwork: false
      hostPID: false
      hostIPC: false
      automountServiceAccountToken: false
      serviceAccountName: todo-api
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: api
          # Pinned by digest so the running image cannot change under us.
          image: snyk-demo/todo-api:1.0.0@sha256:6f9c1b2a4e5d8a3f7b0c9d2e1f4a6b8c0d2e4f6a8b0c2d4e6f8a0b2c4d6e8f00
          imagePullPolicy: Always
          ports:
            - containerPort: 3001
              name: http
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 256Mi
          securityContext:
            privileged: false
            runAsNonRoot: true
            runAsUser: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          env:
            # Secrets are referenced, never inlined in the manifest.
            - name: NODE_ENV
              value: production
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: todo-api-secrets
                  key: database-url
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: todo-api-secrets
                  key: jwt-secret
          volumeMounts:
            # Writable scratch space, so the root filesystem can stay read-only.
            - name: tmp
              mountPath: /tmp
          livenessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: todo-api
  namespace: default
automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: todo-api
  namespace: default
spec:
  # Internal only. External traffic arrives through an ingress that terminates TLS.
  type: ClusterIP
  selector:
    app: todo-api
  ports:
    - port: 80
      targetPort: http
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: todo-api
  namespace: default
spec:
  podSelector:
    matchLabels:
      app: todo-api
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ingress-gateway
      ports:
        - protocol: TCP
          port: 3001
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: todo-db
      ports:
        - protocol: TCP
          port: 5432
